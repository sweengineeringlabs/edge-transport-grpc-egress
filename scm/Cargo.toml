[workspace]
resolver = "2"
# Listed one by one: a glob over main/* would also match main/examples, which holds example crates
# one level deeper and has no manifest of its own. scripts/check_layout.py checks that every crate is listed.
members = [
    "main/auth-bearer-api",
    "main/auth-bearer-std",
    "main/auth-bearer-spi",
    "main/breaker-api",
    "main/breaker-spi",
    "main/resilient-api",
    "main/resilient-spi",
    "main/retry-api",
    "main/retry-std",
    "main/retry-spi",
    "main/test-support",
    "main/transport-api",
    "main/transport-std",
    "main/transport-spi",
    "main/examples/composition-root",
]

[workspace.package]
version      = "0.10.0"
edition      = "2021"
license      = "MIT OR Apache-2.0"
rust-version = "1.99.1"
authors      = ["SWE Engineering Labs"]
repository   = "https://github.com/sweengineeringlabs/edge-transport-grpc-egress"

[workspace.lints.rust]
unsafe_code  = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
