[package]
name = "grpc-egress-transport-std"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
description = "Standard gRPC egress builders and interceptor implementations"
keywords = ["gateway", "egress", "grpc"]
categories = ["network-programming"]

[package.metadata.struct-engine]
application_type = "lib"
service_type = "processor"

[package.metadata.arch]
application_type = "lib"
service_type = "processor"

[dependencies]
grpc-egress-transport-api = { path = "../transport-api" }

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
