[package]
name         = "grpc-egress-resilient-std"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true
authors.workspace      = true
repository.workspace   = true
description  = "edge — resilience decorator for gRPC egress: wraps a bare GrpcEgress in retry + circuit breaker"
keywords     = ["grpc", "resilience", "retry", "circuit-breaker", "swe"]
categories   = ["network-programming"]

[package.metadata.struct-engine]
application_type = "lib"
service_type     = "processor"

[package.metadata.arch]
application_type = "lib"
service_type     = "processor"

[dependencies]
grpc-egress-resilient = { path = "../resilient" }
grpc-egress-transport = { path = "../transport" }
grpc-egress-retry = { path = "../retry" }
grpc-egress-retry-std = { path = "../retry-std" }
grpc-egress-breaker = { path = "../breaker" }
grpc-egress-breaker-std = { path = "../breaker-std" }
toml = "0.8"
[dev-dependencies]
grpc-egress-transport-std = { path = "../transport-std" }
tokio = { version = "1.52", features = ["macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
futures = "0.3"


[lints.rust]
unsafe_code  = "deny"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
