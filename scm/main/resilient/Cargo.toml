[package]
name         = "grpc-egress-resilient"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true
authors.workspace      = true
repository.workspace   = true
description  = "gRPC egress resilience domain: contracts, requests, responses, errors and the resilience policy. No implementation."
keywords     = ["grpc", "resilience", "domain", "swe"]
categories   = ["network-programming"]

[package.metadata.struct-engine]
application_type = "port"
service_type     = "processor"

[package.metadata.arch]
application_type = "port"
service_type     = "processor"

[dependencies]
grpc-egress-transport = { workspace = true }
grpc-egress-retry   = { workspace = true }
grpc-egress-breaker = { workspace = true }
thiserror              = { workspace = true }
serde                  = { workspace = true }
swe-edge-configbuilder = { workspace = true }

[lints.rust]
unsafe_code  = "deny"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
