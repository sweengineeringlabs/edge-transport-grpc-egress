[package]
name         = "grpc-egress-resilient"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true
authors.workspace      = true
repository.workspace   = true
description  = "gRPC egress resilience domain: contracts, requests, responses, errors and the resilience policy. No implementation."
keywords     = ["grpc", "resilience", "domain", "swe"]
categories   = ["network-programming"]

[package.metadata.struct-engine]
application_type = "port"
service_type     = "processor"

[package.metadata.arch]
application_type = "port"
service_type     = "processor"

[dependencies]
grpc-egress-transport = { path = "../transport" }
proto-pattern = { git = "https://github.com/sweengineeringlabs/proto-pattern.git", tag = "v0.10.0" }
grpc-egress-breaker = { path = "../breaker" }
grpc-egress-retry = { path = "../retry" }
thiserror = "2"
serde = { version = "1.0", features = ["derive"] }
swe-edge-configbuilder = { git = "https://github.com/sweengineeringlabs/edge-configbuilder.git", tag = "v0.4.2" }

[dev-dependencies]
futures = "0.3"
tokio = { version = "1.52", features = ["macros", "rt"] }
toml = "0.8"

[lints.rust]
unsafe_code  = "deny"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
