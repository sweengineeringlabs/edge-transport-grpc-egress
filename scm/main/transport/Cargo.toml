[package]
name         = "grpc-egress-transport"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true
authors.workspace      = true
repository.workspace   = true
description  = "gRPC egress domain: the GrpcEgress trait, its requests, responses, errors and options. No implementation."
keywords     = ["grpc", "egress", "domain", "swe"]
categories   = ["network-programming"]

[package.metadata.struct-engine]
application_type = "port"
service_type     = "processor"

[package.metadata.arch]
application_type = "port"
service_type     = "processor"

[features]
default = []
# Exposes the `GrpcEgressProstCodec` marker trait. The trait needs no dependency; the codec
# itself (the `prost` crate) is a dependency of the implementation crate.
prost = []

[dependencies]
serde = { version = "1.0", features = ["derive"] }
thiserror = "2"
futures = "0.3"
tokio-util            = { version = "0.7", default-features = false }
edge-security-runtime = { git = "https://github.com/sweengineeringlabs/edge-security.git", tag = "v0.3.25" }

[lints.rust]
unsafe_code  = "deny"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
