[package]
name         = "grpc-egress-transport"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true
authors.workspace      = true
repository.workspace   = true
description  = "gRPC egress domain: the GrpcEgress trait, its requests, responses, errors and options. No implementation."
keywords     = ["grpc", "egress", "domain", "swe"]
categories   = ["network-programming"]

[package.metadata.struct-engine]
application_type = "port"
service_type     = "processor"

[package.metadata.arch]
application_type = "port"
service_type     = "processor"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
thiserror = "2"
proto-pattern = { git = "https://github.com/sweengineeringlabs/proto-pattern.git", tag = "v0.10.0" }

[dev-dependencies]
tokio = { version = "1.52", features = ["macros", "rt"] }
toml = "0.8"

[lints.rust]
unsafe_code  = "deny"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
