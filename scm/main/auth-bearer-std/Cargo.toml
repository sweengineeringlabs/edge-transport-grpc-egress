[package]
name = "grpc-egress-auth-bearer-std"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
description = "Standard, dependency-light builders for bearer-auth domain types"
keywords = ["grpc", "jwt", "bearer", "auth"]
categories = ["network-programming", "authentication"]

[package.metadata.struct-engine]
application_type = "lib"
service_type = "processor"

[package.metadata.arch]
application_type = "lib"
service_type = "processor"

[dependencies]
grpc-egress-auth-bearer = { path = "../auth-bearer" }

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
