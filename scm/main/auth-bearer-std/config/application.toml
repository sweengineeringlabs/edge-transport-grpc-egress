# Bearer interceptor defaults: placeholder values only. Real deployments MUST
# override `secret`. Only the outbound side lives in this crate.
#
# Outbound config (used when minting tokens):
[outbound]
issuer            = "swe-edge"
audience          = "swe-edge"
subject           = "swe-edge-client"
lifetime_seconds  = 300

[outbound.secret]
kind   = "hs256"
secret = []  # 32+ bytes recommended; populated by env injection at deploy time
