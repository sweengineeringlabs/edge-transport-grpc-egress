[package]
name = "grpc-egress-breaker"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
description = "gRPC egress circuit-breaker domain: contracts, requests, responses, errors and the breaker policy. No implementation."
keywords = ["grpc", "circuit-breaker", "domain", "swe"]
categories = ["network-programming"]

[package.metadata.struct-engine]
application_type = "port"
service_type = "processor"

[package.metadata.arch]
application_type = "port"
service_type = "processor"

[dependencies]
grpc-egress-transport = { workspace = true }
edge-transport-breaker-policy = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
swe-edge-configbuilder.workspace = true

[lints.rust]
unsafe_code  = "deny"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
