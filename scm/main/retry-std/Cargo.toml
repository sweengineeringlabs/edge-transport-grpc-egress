[package]
name = "grpc-egress-retry-std"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
description = "Decorator: gRPC-aware retry around any GrpcEgress"
keywords = ["grpc", "retry", "tonic", "decorator", "swe"]
categories = ["network-programming"]

[package.metadata.struct-engine]
application_type = "lib"
service_type = "processor"

[package.metadata.arch]
application_type = "lib"
service_type = "processor"

[dependencies]
grpc-egress-retry = { workspace = true }
grpc-egress-transport = { workspace = true }
edge-transport-retry        = { workspace = true }
futures = { workspace = true }
# `from_config` parses the policy from TOML; policy values live in `config/application.toml`
# plus consumer overrides, never as literals in source.
toml = { workspace = true }
tokio = { workspace = true, features = ["time", "sync", "macros"] }
tracing = { workspace = true }

[dev-dependencies]
swe-edge-configbuilder = { workspace = true }
grpc-egress-transport-std = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time"] }

[lints.rust]
unsafe_code  = "deny"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
