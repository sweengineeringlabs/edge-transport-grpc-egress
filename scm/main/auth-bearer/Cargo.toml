[package]
name = "grpc-egress-auth-bearer"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
description = "gRPC egress bearer-auth domain: the outbound config, secret, claims, errors and validation contract. No implementation."
keywords = ["grpc", "jwt", "bearer", "auth", "domain"]
categories = ["network-programming", "authentication"]

[package.metadata.struct-engine]
application_type = "port"
service_type = "processor"

[package.metadata.arch]
application_type = "port"
service_type = "processor"

[dependencies]
swe-edge-security = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }

[lints.rust]
unsafe_code  = "deny"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
