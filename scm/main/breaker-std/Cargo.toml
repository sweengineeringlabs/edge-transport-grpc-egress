[package]
name = "grpc-egress-breaker-std"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
description = "Decorator: gRPC-aware circuit breaker around any GrpcEgress"
keywords = ["grpc", "circuit-breaker", "tonic", "decorator", "swe"]
categories = ["network-programming"]

[package.metadata.struct-engine]
application_type = "lib"
service_type = "processor"

[package.metadata.arch]
application_type = "lib"
service_type = "processor"

[dependencies]
grpc-egress-breaker = { path = "../breaker" }
grpc-egress-transport = { path = "../transport" }
edge-transport-breaker-policy = { git = "https://github.com/sweengineeringlabs/edge-transport-breaker.git", tag = "v0.1.1" }
edge-transport-breaker = { git = "https://github.com/sweengineeringlabs/edge-transport-breaker.git", tag = "v0.1.1" }
futures = "0.3"
# `from_config` parses the policy from TOML; policy values live in `config/application.toml`
# plus consumer overrides, never as literals in source.
toml = "0.8"
tokio = { version = "1.52", features = ["macros", "net", "rt", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
swe-edge-configbuilder = { git = "https://github.com/sweengineeringlabs/edge-configbuilder.git", tag = "v0.4.2" }
grpc-egress-transport-std = { path = "../transport-std" }
tokio = { version = "1.52", features = ["macros", "net", "rt", "rt-multi-thread", "sync", "time"] }


[lints.rust]
unsafe_code  = "deny"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
