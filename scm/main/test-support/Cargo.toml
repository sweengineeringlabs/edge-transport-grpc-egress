[package]
name                   = "grpc-egress-test-support"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true
authors.workspace      = true
repository.workspace   = true
description            = "Shared test fixtures of the gRPC egress crates: a closed port and an in-process gRPC peer."
publish                = false
keywords               = ["grpc", "test", "fixtures"]
categories             = ["development-tools::testing"]

[package.metadata.arch]
application_type = "lib"
service_type     = "tester"

[dependencies]
bytes          = "1"
http           = "1"
http-body-util = "0.1"
hyper          = { version = "1", features = ["http2", "server"] }
hyper-util     = { version = "0.1", features = ["tokio"] }
rustls         = { version = "0.23", features = ["aws-lc-rs"] }
socket2        = "0.6"
tokio          = { version = "1", features = ["rt", "net", "time", "sync"] }

[dev-dependencies]
hyper = { version = "1", features = ["client", "http2"] }
tokio = { version = "1", features = ["macros", "rt", "net", "time"] }

[lints.rust]
unsafe_code  = "deny"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
