[package]
name = "grpc-egress-example-composition-root"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
description = "What a composition root does with the gRPC egress crates: assemble a client from a loaded config and options, then wrap it. Example, not published."
publish = false

[package.metadata.arch]
application_type = "binary"
service_type = "processor"

[dependencies]
grpc-egress-transport-api = { path = "../../transport-api" }
grpc-egress-transport-std = { path = "../../transport-std" }
grpc-egress-transport-spi = { path = "../../transport-spi" }
grpc-egress-retry-api = { path = "../../retry-api" }
grpc-egress-retry-spi = { path = "../../retry-spi" }
grpc-egress-breaker-api = { path = "../../breaker-api" }
grpc-egress-breaker-spi = { path = "../../breaker-spi" }
# The in-process peer the scenarios talk to (an example of a composition root has no server of its own).
grpc-egress-test-support = { path = "../../test-support" }
edge-security-runtime = { git = "https://github.com/sweengineeringlabs/edge-security.git", tag = "v0.3.39" }
proto-pattern = { git = "https://github.com/sweengineeringlabs/proto-pattern.git", tag = "v0.12.0" }
# A real tonic server, for the scenarios that need to see a call end on the server (cancellation).
proto-test-peer = { git = "https://github.com/sweengineeringlabs/proto-svc.git", tag = "v0.4.3" }
prost = "0.14"
tokio-util = { version = "0.7", default-features = false }
tokio = { version = "1.52", features = ["macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
toml = "0.8"

[lints.rust]
unsafe_code  = "deny"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
